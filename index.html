<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মোঃ নাঈম আকন</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 30px 15px;
      text-align: center;
    }
    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 4px 15px #ccc;
    }
    h1 {
      color: #222;
    }
    h2 {
      color: #444;
    }
    p {
      font-size: 17px;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>মোঃ নাঈম আকন</h1>
    <h2>আমার ব্যক্তিগত ওয়েবসাইট</h2>

    <p>
      আমি মোঃ নাঈম আকন। আমি বাংলাদেশের একজন শিক্ষার্থী।
      আমার আগ্রহ গান ও সংগীতের প্রতি।
    </p>

    <h2>আমার আগ্রহ</h2>
    <p>🎵 গান ও সংগীত</p>
    <p>🎶 লোকসংগীত</p>
    <p>📚 পড়াশোনা</p>

    <h2>আমার সম্পর্কে</h2>
    <p>
      বাংলাদেশ • বরিশাল
    </p>
  </div>

</body>
</html>
